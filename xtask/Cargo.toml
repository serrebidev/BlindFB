[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["update-check"]
update-check = ["dep:ship-shape"]

[dependencies]
shipfitter = { version = "0.2.5", features = ["package"] }
ship-shape = { version = "0.6", optional = true }
minisign = "0.10.0"
# The check the updater itself makes on a download.
minisign-verify = "0.3"
