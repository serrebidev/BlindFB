name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux pins ubuntu-22.04 (glibc 2.35): an ubuntu-latest build
        # demanded glibc 2.43 and would not start on Debian 13 or
        # Ubuntu 24.04 LTS at all (found installing v0.7.8 on a server).
        os: [windows-latest, wsl-linux-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install wxWidgets build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Jammy quirk (proven on the runner image): in one combined
          # transaction apt refuses libgstreamer1.0-dev's libunwind-dev
          # dependency; installing libunwind-dev on its own first
          # anchors it and the full list then resolves.
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            libclang-dev pkg-config libgtk-3-dev libpng-dev libjpeg-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-x
          # The job image ships libgstreamer-plugins-bad1.0-dev. With it wxWidgets
          # builds its gst_player media backend, which wxdragon-sys never links
          # (undefined gst_player_* at link time), and the app would then need
          # libgstplayer on every user's machine. Released builds use the plain
          # GStreamer backend, so remove it in this job's container only.
          sudo apt-get remove -y libgstreamer-plugins-bad1.0-dev

      # Host runners (macOS, Windows) start every job in a fresh,
      # randomly named work folder, so rust-cache never matched
      # there: its cache version hashes the absolute target path
      # ("No cache found", full rebuilds every run). target/ points
      # at a fixed folder on the runner instead and builds reuse the
      # previous run directly. Two jobs on one folder take turns:
      # cargo locks its target folder.
      # Owner-approved 2026-11-10 (same fix as BlindRSS-Rust df47812).
      # CARGO_TARGET_DIR is the folder's real path: CMake caches
      # absolute paths, and the path through the link changes
      # with every work folder ("CMakeCache.txt directory ... is
      # different"). The link keeps target/... references working.
      # ponytail: the folder only grows; delete it on the runner
      # when disk gets tight (next build is cold once).
      - name: Persistent target folder (Windows host runner)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = 'C:/forgejo-runner/cargo-target/BlindFB/package'
          New-Item -ItemType Directory -Force $dir | Out-Null
          if (Test-Path target) { cmd /c rmdir /s /q target }
          New-Item -ItemType Junction -Path target -Target $dir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$dir"

      - name: Persistent target folder (macOS host runner)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="$HOME/forgejo-runner/cargo-target/BlindFB/package"
          mkdir -p "$dir"
          rm -rf target
          ln -s "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # Linux legs run on desknasbox's WSL (runner wsl-linux-x64) in a job
      # container. The runner mounts persistent volumes at
      # /root/forgejo-runner/cargo-target and cargo's registry and git
      # caches, so target/ points at a fixed folder there exactly as on
      # the host runners, and the job image ships the apt packages and
      # Rust (owner request 2026-11-11: Linux as fast as the other legs).
      # CARGO_TARGET_DIR is the real path: CMake caches absolute paths.
      - name: Persistent target folder (Linux WSL runner)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="$HOME/forgejo-runner/cargo-target/BlindFB/package-22.04"
          mkdir -p "$dir"
          rm -rf target
          ln -s "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate release
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          node crates/core/src/post_scripts/reader.test.js
          node crates/core/src/post_scripts/questions.test.js
          node crates/core/src/reels.test.js

      - name: Package with shipfitter (cargo xtask package)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: cargo xtask package

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true

      # Drop only the link, never the shared folder behind it,
      # before the runner deletes the work folder.
      - name: Unlink persistent target folder (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path target) { (Get-Item target).Delete() }

      - name: Unlink persistent target folder (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f target

      - name: Unlink persistent target folder (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: rm -f target

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The release notes are the tag's section of CHANGELOG.md, the way
      # BlindRadio ships them — never an empty body or a compare link. A
      # release with no section written does not publish.
      - name: Take the release notes from CHANGELOG.md
        run: |
          python3 - "${{ github.ref_name }}" <<'PY'
          import sys
          tag = sys.argv[1]
          notes, inside = [], False
          for line in open("CHANGELOG.md").read().splitlines():
              if line.startswith("## "):
                  inside = line.startswith("## " + tag + " ") or line.strip() == "## " + tag
                  continue
              if inside:
                  notes.append(line)
          body = "\n".join(notes).strip()
          if not body:
              sys.exit("CHANGELOG.md has no section for " + tag)
          open("release-notes.md", "w").write(body + "\n")
          print(body)
          PY

      - name: Verify every asset and signature arrived, then publish
        env:
          TOKEN: ${{ github.token }}
        run: python3 .github/publish_release.py "${{ github.ref_name }}" release-notes.md
