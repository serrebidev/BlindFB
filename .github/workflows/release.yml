name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux pins ubuntu-22.04 (glibc 2.35): an ubuntu-latest build
        # demanded glibc 2.43 and would not start on Debian 13 or
        # Ubuntu 24.04 LTS at all (found installing v0.7.8 on a server).
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install wxWidgets build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Jammy quirk (proven on the runner image): in one combined
          # transaction apt refuses libgstreamer1.0-dev's libunwind-dev
          # dependency; installing libunwind-dev on its own first
          # anchors it and the full list then resolves.
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            libclang-dev pkg-config libgtk-3-dev libpng-dev libjpeg-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-x

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate release
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          node crates/core/src/post_scripts/reader.test.js
          node crates/core/src/reels.test.js

      - name: Package with shipfitter (cargo xtask package)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: cargo xtask package

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The release notes are the tag's section of CHANGELOG.md, the way
      # BlindRadio ships them — never an empty body or a compare link. A
      # release with no section written does not publish.
      - name: Take the release notes from CHANGELOG.md
        run: |
          python3 - "${{ github.ref_name }}" <<'PY'
          import sys
          tag = sys.argv[1]
          notes, inside = [], False
          for line in open("CHANGELOG.md").read().splitlines():
              if line.startswith("## "):
                  inside = line.startswith("## " + tag + " ") or line.strip() == "## " + tag
                  continue
              if inside:
                  notes.append(line)
          body = "\n".join(notes).strip()
          if not body:
              sys.exit("CHANGELOG.md has no section for " + tag)
          open("release-notes.md", "w").write(body + "\n")
          print(body)
          PY

      - name: Verify every asset and signature arrived, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          present="$(gh release view "$tag" -R "${{ github.repository }}" --json assets --jq '.assets[].name')"
          echo "$present"
          for wanted in BlindFB.zip BlindFB.zip.minisig BlindFB.tar.gz BlindFB.tar.gz.minisig BlindFB-arm64.dmg BlindFB-arm64.dmg.minisig; do
            grep -qx "$wanted" <<<"$present" || { echo "missing: $wanted"; exit 1; }
          done
          gh release edit "$tag" -R "${{ github.repository }}" --notes-file release-notes.md --draft=false --latest
