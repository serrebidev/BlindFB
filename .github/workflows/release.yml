name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install wxWidgets build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev pkg-config libgtk-3-dev libpng-dev libjpeg-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-x

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate release
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          node crates/core/src/post_scripts/reader.test.js
          node crates/core/src/reels.test.js

      - name: Package with shipfitter (cargo xtask package)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: cargo xtask package

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Verify every asset and signature arrived, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          present="$(gh release view "$tag" -R "${{ github.repository }}" --json assets --jq '.assets[].name')"
          echo "$present"
          for wanted in BlindFB.zip BlindFB.zip.minisig BlindFB.tar.gz BlindFB.tar.gz.minisig BlindFB-arm64.dmg BlindFB-arm64.dmg.minisig; do
            grep -qx "$wanted" <<<"$present" || { echo "missing: $wanted"; exit 1; }
          done
          gh release edit "$tag" -R "${{ github.repository }}" --draft=false --latest
