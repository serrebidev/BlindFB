name: Release

# Manual only: the Forgejo-to-GitHub sync disables GitHub workflows with
# automatic triggers.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish, such as v0.7.80
        required: true
        type: string
      dry_run:
        description: Build and sign only; publish nothing
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux pins ubuntu-22.04 (glibc 2.35): an ubuntu-latest build
        # demanded glibc 2.43 and would not start on Debian 13 or
        # Ubuntu 24.04 LTS at all (found installing v0.7.8 on a server).
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install wxWidgets build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Jammy quirk (proven on the runner image): in one combined
          # transaction apt refuses libgstreamer1.0-dev's libunwind-dev
          # dependency; installing libunwind-dev on its own first
          # anchors it and the full list then resolves.
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            libclang-dev pkg-config libgtk-3-dev libpng-dev libjpeg-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-x
          # The job image ships libgstreamer-plugins-bad1.0-dev. With it wxWidgets
          # builds its gst_player media backend, which wxdragon-sys never links
          # (undefined gst_player_* at link time), and the app would then need
          # libgstplayer on every user's machine. Released builds use the plain
          # GStreamer backend, so remove it in this job's container only.
          sudo apt-get remove -y libgstreamer-plugins-bad1.0-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate release
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          node crates/core/src/post_scripts/reader.test.js
          node crates/core/src/post_scripts/questions.test.js
          node crates/core/src/post_scripts/identities.test.js
          node crates/core/src/reels.test.js

      - name: Package with shipfitter (cargo xtask package)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: cargo xtask package

      # Forgejo's own release API, not the GitHub-only softprops action:
      # the script finds or creates the tag's draft (the three legs race,
      # creation retries) and uploads this leg's dist/ files to it.
      - name: Upload to the Forgejo release draft
        if: ${{ runner.os == 'Windows' && !inputs.dry_run }}
        shell: pwsh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: https://git.serrebiradio.com
          FORGEJO_REPO: serrebi/BlindFB
        # py, not python: the runner's PATH Python can vanish (v0.7.73's first
        # run); the launcher in C:\Windows finds any installed one.
        run: py -3 .github/upload_release_assets.py "${{ inputs.release_tag }}" dist

      - name: Upload to the Forgejo release draft
        if: ${{ runner.os != 'Windows' && !inputs.dry_run }}
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: https://git.serrebiradio.com
          FORGEJO_REPO: serrebi/BlindFB
        run: python3 .github/upload_release_assets.py "${{ inputs.release_tag }}" dist

      - name: Cargo clean (free disk)
        if: always()
        continue-on-error: true
        run: cargo clean

  publish:
    name: Publish
    needs: package
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      # The release notes are the tag's section of CHANGELOG.md, the way
      # BlindRadio ships them — never an empty body or a compare link. A
      # release with no section written does not publish.
      - name: Take the release notes from CHANGELOG.md
        run: |
          python3 - "${{ inputs.release_tag }}" <<'PY'
          import sys
          tag = sys.argv[1]
          notes, inside = [], False
          for line in open("CHANGELOG.md").read().splitlines():
              if line.startswith("## "):
                  inside = line.startswith("## " + tag + " ") or line.strip() == "## " + tag
                  continue
              if inside:
                  notes.append(line)
          body = "\n".join(notes).strip()
          if not body:
              sys.exit("CHANGELOG.md has no section for " + tag)
          open("release-notes.md", "w").write(body + "\n")
          print(body)
          PY

      - name: Verify every asset and signature arrived, then publish
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: https://git.serrebiradio.com
          FORGEJO_REPO: serrebi/BlindFB
        run: python3 .github/publish_release.py "${{ inputs.release_tag }}" release-notes.md
