name: CI

on:
  push:
  pull_request:

# A superseded run is wasted wxWidgets build time, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # wxdragon-sys compiles wxWidgets from source on a cold cache.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install wxWidgets build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev pkg-config libgtk-3-dev libpng-dev libjpeg-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-x
          # The job image ships libgstreamer-plugins-bad1.0-dev. With it wxWidgets
          # builds its gst_player media backend, which wxdragon-sys never links
          # (undefined gst_player_* at link time), and the app would then need
          # libgstplayer on every user's machine. Released builds use the plain
          # GStreamer backend, so remove it in this job's container only.
          sudo apt-get remove -y libgstreamer-plugins-bad1.0-dev

      - name: Test Linux launcher
        if: runner.os == 'Linux'
        run: sh packaging/test-linux-launcher.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Reader and reels fixtures
        run: |
          node crates/core/src/post_scripts/reader.test.js
          node crates/core/src/post_scripts/questions.test.js
          node crates/core/src/post_scripts/identities.test.js
          node crates/core/src/reels.test.js

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Cargo clean (free disk)
        if: always()
        continue-on-error: true
        run: cargo clean
      # Ephemeral GitHub runners delete the work folder with
      # the job; nothing to unlink (owner 2026-11-18).
