# Generated from release.yml (package job): the macOS leg only, for the Forgejo Mac runner.
# Dispatch with release_tag to attach the macOS build to an existing release.
name: macOS release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build macOS for and attach to
        required: true
        type: string
permissions:
  contents: write
jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.release_tag }}
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.release_tag }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy,rustfmt
    # No Validate step: CI (push/PR) already gates the same commit.
    - name: Package with shipfitter (cargo xtask package)
      env:
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: cargo run --locked -p xtask --no-default-features -- package
    - name: Attach to the Forgejo release
      env:
        FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      run: |
        set -euo pipefail
        api="https://git.serrebiradio.com/api/v1/repos/serrebi/BlindFB"
        h="Authorization: token $FORGEJO_TOKEN"
        release="$(curl -sf -H "$h" "$api/releases/tags/$TAG")"
        id="$(echo "$release" | jq -r .id)"
        for file in dist/BlindFB-arm64.dmg dist/BlindFB-arm64.dmg.minisig; do
          name="$(basename "$file")"
          old="$(echo "$release" | jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id')"
          [ -z "$old" ] || curl -sf -X DELETE -H "$h" "$api/releases/$id/assets/$old"
          echo "Uploading $name ($(wc -c < "$file") bytes)"
          curl -sf -o /dev/null -w 'HTTP %{http_code}, %{size_upload} bytes in %{time_total}s\n' \
            -H "$h" -F "attachment=@$file" "$api/releases/$id/assets?name=$name"
          echo "Attached $name to $TAG"
        done
