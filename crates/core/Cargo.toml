[package]
name = "blindfb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend for BlindFB: drives the facebook-cli (fb) binary and parses its output"

[dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
rookie-cookies = "=0.6.0"
